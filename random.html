<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizVerse • Random Quiz</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Dark Mode Support -->
    <link rel="stylesheet" href="/static/dark-mode.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.01);
            background-color: #f3f4f6;
        }

        .progress-bar {
            transition: width 0.4s ease;
        }

        .pulse-timer {
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from {
                transform: scale(1);
                color: #dc2626;
            }

            to {
                transform: scale(1.1);
                color: #991b1b;
            }
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        [data-theme="dark"] .glass-card {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        [data-theme="dark"] .option-btn:hover:not(:disabled) {
            background-color: rgba(99, 102, 241, 0.2) !important;
            border-color: rgba(99, 102, 241, 0.4) !important;
            color: #818cf8 !important;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/user_dashboard" class="flex items-center gap-2">
                <img src="/static/logo.png" width="40" alt="QuizVerse" class="rounded-lg">
                <span class="text-xl font-bold text-gray-900">QuizVerse</span>
            </a>
            <div class="flex items-center gap-4">
                <button id="darkModeToggle"
                    class="w-10 h-10 rounded-lg hover:bg-gray-100 flex items-center justify-center transition">
                    <i data-feather="sun" id="sunIcon"></i>
                    <i data-feather="moon" id="moonIcon" style="display: none;"></i>
                </button>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-purple-200 shadow-sm">
                        <img id="userAvatar" src="/static/avatars/avtar1.jpg" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <span class="text-sm font-bold text-gray-700" id="usernameDisplay">...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Quiz Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">

        <!-- Loading State -->
        <div id="loading" class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-purple-600 mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium" id="loadingText">Preparing your random quiz...</p>
        </div>

        <!-- Quiz Container (hidden until ready) -->
        <div id="quizContainer" class="hidden w-full max-w-2xl glass-card rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header/Progress -->
            <div class="p-6 border-b border-gray-100 flex flex-col gap-4">
                <div class="flex justify-between items-center text-sm font-bold text-gray-500">
                    <span id="categoryName">RANDOM CHALLENGE</span>
                    <span id="questionCounter">Question 1 of 15</span>
                </div>
                <!-- Progress Line -->
                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                    <div id="progressBar" class="progress-bar bg-purple-600 h-2 rounded-full" style="width: 0%"></div>
                </div>
                <div class="flex justify-center">
                    <div id="timer" class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i data-feather="clock" class="text-purple-600"></i>
                        <span>30s</span>
                    </div>
                </div>
            </div>

            <!-- Question & Options -->
            <div class="p-8">
                <h2 id="questionText" class="text-2xl font-bold text-gray-800 mb-8 leading-tight"></h2>
                <div id="optionsGrid" class="grid grid-cols-1 gap-4">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Footer/Actions -->
            <div class="p-6 bg-gray-50 flex justify-end">
                <button id="nextBtn"
                    class="hidden bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105">
                    Next Question <i data-feather="chevron-right" class="ml-2"></i>
                </button>
            </div>
        </div>



        <!-- Result Card -->
        <div id="resultCard" class="hidden w-full max-w-md glass-card rounded-2xl shadow-2xl p-8 text-center">
            <div class="w-24 h-24 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">
                🏆
            </div>
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Quiz Completed!</h2>
            <p class="text-gray-500 mb-8" id="resultMessage">Great job on finishing the quiz.</p>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="p-4 bg-gray-50 rounded-xl">
                    <p class="text-xs text-gray-400 font-bold uppercase mb-1">Score</p>
                    <p class="text-2xl font-bold text-gray-900"><span id="resScore">0</span>/<span
                            id="resTotal">0</span></p>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl">
                    <p class="text-xs text-gray-400 font-bold uppercase mb-1">Percentage</p>
                    <p class="text-2xl font-bold text-purple-600"><span id="resPercent">0</span>%</p>
                </div>
            </div>

            <div id="levelUpMsg" class="hidden mb-6 p-4 bg-indigo-100 text-indigo-700 rounded-xl font-bold">
                🎉 Level Up! You reached Level <span id="newLevel">2</span>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="location.reload()"
                    class="w-full bg-purple-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-purple-700 transition">
                    Play Again
                </button>
                <a href="/user_dashboard"
                    class="w-full bg-gray-200 text-gray-700 py-4 rounded-xl font-bold hover:bg-gray-300 transition block">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </main>

    <script src="/static/dark-mode.js"></script>
    <script>
        // ─── Constants ────────────────────────────────────────────────────────────
        // Random quiz uses a special sentinel category id = 0 in localStorage key
        const RANDOM_SESSION_KEY = 'random_quiz_cat_id';
        const token = localStorage.getItem('access_token');

        // Redirect if not logged in (server also guards, but JS as double-check)
        if (!token) {
            window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
        }

        // ─── State ────────────────────────────────────────────────────────────────
        let quizData = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let userAnswers = [];
        let startTime = null;
        let activeCategoryId = null; // The category ID actually used for this random session

        // ─── Elements ─────────────────────────────────────────────────────────────
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const quizContainer = document.getElementById('quizContainer');
        const resultCard = document.getElementById('resultCard');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const nextBtn = document.getElementById('nextBtn');
        const timerEl = document.getElementById('timer');
        const questionCounter = document.getElementById('questionCounter');
        const progressBar = document.getElementById('progressBar');
        const categoryName = document.getElementById('categoryName');

        // ─── Init ─────────────────────────────────────────────────────────────────
        async function init() {
            try {
                // Show username
                const profileRes = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!profileRes.ok) throw new Error('Session expired. Please log in again.');
                const profile = await profileRes.json();
                usernameDisplay.textContent = profile.username;
                const avatarFile = profile.profile_picture || 'avtar1.jpg';
                document.getElementById('userAvatar').src = `/static/avatars/${avatarFile}`;

                // Fetch all categories
                const catsRes = await fetch('/api/categories');
                const cats = await catsRes.json();
                if (!cats || cats.length === 0) throw new Error('No quiz categories found. Ask an admin to add some!');

                // No existing session → start fresh
                await startFresh(cats);

            } catch (err) {
                console.error(err);
                loadingText.innerHTML = `<span class="text-red-500 font-bold">${err.message}</span>`;
            }
        }

        async function startFresh(catsOverride) {
            loading.classList.remove('hidden');
            quizContainer.classList.add('hidden');
            loadingText.textContent = 'Picking a random category...';

            try {
                // Fetch cats if not passed
                let cats = catsOverride;
                if (!cats) {
                    const catsRes = await fetch('/api/categories');
                    cats = await catsRes.json();
                }
                if (!cats || cats.length === 0) throw new Error('No categories available.');

                // Pick random category
                const randomCat = cats[Math.floor(Math.random() * cats.length)];
                activeCategoryId = randomCat.id;

                categoryName.textContent = '🎲 RANDOM — ' + randomCat.name.toUpperCase();
                loadingText.textContent = `Loading ${randomCat.name} questions...`;

                // Fetch questions
                const res = await fetch(`/api/categories/${activeCategoryId}/questions?limit=15`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                quizData = await res.json();

                if (!quizData || quizData.length === 0)
                    throw new Error('No questions available in this category. Try again!');

                currentIndex = 0;
                score = 0;
                userAnswers = [];

                loading.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                loadQuestion();

            } catch (err) {
                loadingText.innerHTML = `<span class="text-red-500 font-bold">${err.message}</span>`;
                loading.classList.remove('hidden');
            }
        }

        // ─── Question Display ─────────────────────────────────────────────────────
        function loadQuestion() {
            const q = quizData[currentIndex];
            questionText.textContent = q.text;
            optionsGrid.innerHTML = '';

            questionCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            progressBar.style.width = ((currentIndex + 1) / quizData.length * 100) + '%';

            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.dataset.optionId = opt.id;
                btn.className = 'option-btn w-full p-5 text-left bg-white border-2 border-gray-100 rounded-2xl font-medium text-gray-700 flex items-center justify-between';
                btn.innerHTML = `<span>${opt.text}</span><i data-feather="circle" class="text-gray-200 opacity-20"></i>`;
                btn.onclick = () => selectOption(btn, opt);
                optionsGrid.appendChild(btn);
                feather.replace();
            });

            nextBtn.classList.add('hidden');
            if (!startTime) startTime = Date.now();
            startTimer(q.time_limit || 30);
        }

        // ─── Timer ────────────────────────────────────────────────────────────────
        function startTimer(duration) {
            clearInterval(timerInterval);
            timeLeft = duration;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeUp();
                }
            }, 1000);
        }

        function updateTimerUI() {
            timerEl.querySelector('span').textContent = `${timeLeft}s`;
            if (timeLeft <= 5) timerEl.classList.add('pulse-timer');
            else timerEl.classList.remove('pulse-timer');
        }

        // ─── Answer Selection ─────────────────────────────────────────────────────
        async function selectOption(btn, option) {
            clearInterval(timerInterval);
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            // Show loading spinner - replace the SVG/icon in this button
            const oldIcon = btn.querySelector('svg') || btn.querySelector('i');
            if (oldIcon) {
                const loader = document.createElement('i');
                loader.setAttribute('data-feather', 'loader');
                loader.className = 'animate-spin opacity-100 text-purple-500';
                oldIcon.replaceWith(loader);
                feather.replace();
            }

            try {
                const res = await fetch('/api/check_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: quizData[currentIndex].id,
                        option_id: option.id
                    })
                });
                const data = await res.json();

                userAnswers.push({
                    question_id: quizData[currentIndex].id,
                    option_id: option.id
                });

                // Replace the loader with the result icon
                const currentIcon = btn.querySelector('svg') || btn.querySelector('i');
                if (data.is_correct) {
                    btn.classList.replace('border-gray-100', 'border-green-500');
                    btn.classList.add('bg-green-50');
                    const newIcon = document.createElement('i');
                    newIcon.setAttribute('data-feather', 'check-circle');
                    newIcon.className = 'text-green-500 opacity-100';
                    if (currentIcon) currentIcon.replaceWith(newIcon);
                    feather.replace();
                    score++;
                } else {
                    btn.classList.replace('border-gray-100', 'border-red-500');
                    btn.classList.add('bg-red-50');
                    const newIcon = document.createElement('i');
                    newIcon.setAttribute('data-feather', 'x-circle');
                    newIcon.className = 'text-red-500 opacity-100';
                    if (currentIcon) currentIcon.replaceWith(newIcon);
                    feather.replace();
                    autoMarkCorrect(data.correct_option_id);
                }

            } catch (err) {
                console.error('Verification failed', err);
            }

            nextBtn.classList.remove('hidden');
        }

        async function handleTimeUp() {
            // Disable all option buttons
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            // Record as wrong answer
            userAnswers.push({ question_id: quizData[currentIndex].id, option_id: null });

            // Show "Time's Up!" in the timer
            timerEl.querySelector('span').textContent = "Time's Up!";
            timerEl.classList.remove('pulse-timer');

            // Fetch the correct answer from server and highlight it
            try {
                const res = await fetch('/api/check_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: quizData[currentIndex].id,
                        option_id: quizData[currentIndex].options[0].id 
                    })
                });
                const data = await res.json();
                autoMarkCorrect(data.correct_option_id);
            } catch (err) {
                console.error("Could not fetch correct answer", err);
            }

            // Auto-skip to next question after 1.5s
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizData.length) {
                    loadQuestion();
                } else {
                    submitQuiz();
                }
            }, 1500);
        }

        function autoMarkCorrect(correctOptionId) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                if (btn.dataset.optionId == correctOptionId) {
                    btn.classList.replace('border-gray-100', 'border-green-500');
                    btn.classList.add('bg-green-50');
                    const oldIcon = btn.querySelector('svg') || btn.querySelector('i');
                    if (oldIcon) {
                        const newIcon = document.createElement('i');
                        newIcon.setAttribute('data-feather', 'check-circle');
                        newIcon.className = 'text-green-500 opacity-50';
                        oldIcon.replaceWith(newIcon);
                        feather.replace();
                    }
                }
            });
        }

        // ─── Submit ───────────────────────────────────────────────────────────────
        async function submitQuiz() {
            quizContainer.classList.add('hidden');
            loading.classList.remove('hidden');
            loadingText.textContent = 'Submitting results...';

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        category_id: activeCategoryId,
                        answers: userAnswers,
                        time_taken: Math.floor((Date.now() - startTime) / 1000)
                    })
                });
                const data = await res.json();


                loading.classList.add('hidden');
                resultCard.classList.remove('hidden');

                document.getElementById('resScore').textContent = data.score;
                document.getElementById('resTotal').textContent = data.total;
                document.getElementById('resPercent').textContent = data.percentage;

                const pct = data.percentage;
                const msg = document.getElementById('resultMessage');
                if (pct >= 80) msg.textContent = '🌟 Amazing! You\'re a true champion!';
                else if (pct >= 50) msg.textContent = '🎯 Well done! You have a good handle on things.';
                else msg.textContent = '💪 Keep practicing! You\'ll get better every time.';

                if (data.level_up) {
                    document.getElementById('levelUpMsg').classList.remove('hidden');
                    document.getElementById('newLevel').textContent = data.level_up;
                }

            } catch (err) {
                loadingText.innerHTML = `<span class="text-red-500 font-bold">Submission failed. Local score: ${score}</span>`;
            }
        }

        // ─── Next Button ──────────────────────────────────────────────────────────
        nextBtn.onclick = () => {
            currentIndex++;
            if (currentIndex < quizData.length) {
                loadQuestion();
            } else {
                submitQuiz();
            }
        };

        // ─── Start ────────────────────────────────────────────────────────────────
        init();
        feather.replace();
    </script>
</body>

</html>
