<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizVerse • Create Account</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Dark Mode Support -->
    <link rel="stylesheet" href="/static/dark-mode.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .right-alignment {
            text-align: right
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-primary {
            background: linear-gradient(to right, #667eea, #764ba2);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .password-requirements {
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }

        .requirement.met {
            color: #4CAF50;
        }

        .requirement i {
            font-size: 0.65rem;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Dark Mode Toggle -->
    <div class="fixed top-6 right-6 z-50">
        <button id="darkModeToggle"
            class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/20 hover:bg-white/30 backdrop-blur-md transition text-white border border-white/20">
            <i data-feather="sun" id="sunIcon"></i>
            <i data-feather="moon" id="moonIcon" style="display:none;"></i>
        </button>
    </div>
    <div class="login-card rounded-2xl shadow-2xl overflow-hidden w-full max-w-md">
        <div class="p-8 sm:p-10">
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div>
                        <img src='static/logo.png' alt='LOGO' width='80' height='50'
                            class="w-50 h-50 rounded-lg flex items-center justify-center">
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Welcome to QuizVerse</h1>
                <p class="text-white/80">Quizzically analyze your knowledge</p>
            </div>

            <form class="mt-8 space-y-6">
                <label for="name" class="block text-sm font-medium text-white mb-2">Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-feather="user" class="text-white/60"></i>
                    </div>
                    <input id="username" name="name" type="text" autocomplete="name" required
                        class="input-field pl-10 w-full px-4 py-3 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/30">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-white mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="mail" class="text-white/60"></i>
                        </div>
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="input-field pl-10 w-full px-4 py-3 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/30">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-white mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="lock" class="text-white/60"></i>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="new-password" required
                            class="input-field pl-10 w-full px-4 py-3 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/30"
                            oninput="checkPasswordStrength()">
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        <div class="requirement" id="reqLength"><i data-feather="circle"></i> At least 8 characters
                        </div>
                        <div class="requirement" id="reqUpper"><i data-feather="circle"></i> One uppercase letter</div>
                        <div class="requirement" id="reqLower"><i data-feather="circle"></i> One lowercase letter</div>
                        <div class="requirement" id="reqNumber"><i data-feather="circle"></i> One number</div>
                    </div>
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-white mb-2">Confirm
                        Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="lock" class="text-white/60"></i>
                        </div>
                        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password"
                            required
                            class="input-field pl-10 w-full px-4 py-3 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/30">
                    </div>
                </div>
                <div>
                    <p class="right-alignment text-sm text-white/80 mb-4">
                        Already have an account?
                        <a href="/login" class="text-white underline hover:text-white/90">Sign in</a>
                    </p>
                    <button type="submit"
                        class="btn-primary w-full flex justify-center py-3 px-4 border border- rounded-lg text-sm font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white/50 transition-all duration-300">
                        Sign up
                    </button>
                </div>
                <p class="text-center text-sm text-white/80 mb-4">Thank You for signing up!</p>
            </form>
        </div>
    </div>
    <!-- Feather Icons Initialization -->
    <script>
        feather.replace();
    </script>

    <!-- Password Validation Script -->
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('strengthBar');

            let strength = 0;
            let color = '#f44336';

            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            if (hasLength) strength += 25;
            if (hasUpper) strength += 25;
            if (hasLower) strength += 25;
            if (hasNumber) strength += 25;

            if (strength >= 75) color = '#4CAF50';
            else if (strength >= 50) color = '#FF9800';
            else if (strength >= 25) color = '#FF5722';

            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;

            // Update requirement indicators
            toggleRequirement('reqLength', hasLength);
            toggleRequirement('reqUpper', hasUpper);
            toggleRequirement('reqLower', hasLower);
            toggleRequirement('reqNumber', hasNumber);
        }

        function toggleRequirement(id, met) {
            const el = document.getElementById(id);
            if (met) {
                el.classList.add('met');
                el.querySelector('i').setAttribute('data-feather', 'check-circle');
            } else {
                el.classList.remove('met');
                el.querySelector('i').setAttribute('data-feather', 'circle');
            }
            feather.replace();
        }

        function isStrongPassword(password) {
            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumbers = /\d/.test(password);
            const hasMinimumLength = password.length >= 8;
            return hasUpperCase && hasLowerCase && hasNumbers && hasMinimumLength;
        }
    </script>
    <!-- Form Submission Script -->
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop the page from refreshing

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (!isStrongPassword(password)) {
                alert("Password must be at least 8 characters with uppercase, lowercase letters and numbers");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false; // stop form submit
            }

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.status === 400 || response.status === 409) {
                    alert("Error: " + data.msg);
                } else if (response.status === 201) {
                    alert("Account created successfully!");
                    window.location.href = '/login';
                } else {
                    alert("Error: " + (data.msg || "Something went wrong"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong connecting to the server.");
            }
        });
    </script>
    <script src="/static/dark-mode.js"></script>
</body>

</html>
