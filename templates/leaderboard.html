<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizVerse • Leaderboard</title>
    <link rel="icon" type="image/png" href="/static/title%20logo.png">
    <meta name="description" content="See the top quiz performers on QuizVerse. Compete and climb the ranks!">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/dark-mode.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .rank-2 {
            background: linear-gradient(135deg, #C0C0C0, #A9A9A9);
        }

        .rank-3 {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
        }

        .podium-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .podium-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .lb-row {
            transition: background 0.2s;
        }

        .lb-row:hover {
            background: #f3f0ff;
        }

        .bar-fill {
            transition: width 1.5s ease-in-out;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-auto py-3 flex flex-wrap items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-2">
                <img src="/static/title%20logo.png" alt="QuizVerse Logo"
                    class="w-10 h-10 rounded-xl object-contain bg-white shadow-sm">
                <span class="text-xl font-bold text-gray-900 hidden sm:block">QuizVerse</span>
            </a>
            <div class="flex flex-wrap items-center gap-4 justify-center w-full sm:w-auto">
                <a href="/explore"
                    class="text-gray-600 hover:text-purple-600 font-medium transition text-sm sm:text-base">Explore</a>
                <a href="/leaderboard"
                    class="text-purple-700 font-semibold border-b-2 border-purple-600 text-sm sm:text-base">Leaderboard</a>
                <a href="/user_dashboard"
                    class="text-gray-600 hover:text-purple-600 font-medium transition text-sm sm:text-base">Dashboard</a>

                <!-- Dark Mode Toggle -->
                <button id="darkModeToggle"
                    class="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-xl bg-gray-100 hover:bg-gray-200 transition text-gray-600 ml-2">
                    <i data-feather="sun" id="sunIcon"></i>
                    <i data-feather="moon" id="moonIcon" style="display:none;"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="text-5xl mb-3">🏆</div>
            <h1 class="text-4xl font-extrabold text-gray-800">Leaderboard</h1>
            <p class="text-gray-500 mt-2">Top performers across all quizzes. Can you make the list?</p>
        </div>

        <!-- Category Filter -->
        <div class="flex flex-wrap gap-3 justify-center mb-8">
            <select id="categoryFilter" onchange="loadLeaderboard()"
                class="border border-purple-300 rounded-xl px-4 py-2 text-gray-700 font-medium focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white shadow-sm">
                <option value="">🌍 All Categories</option>
            </select>
            <select id="limitFilter" onchange="loadLeaderboard()"
                class="border border-purple-300 rounded-xl px-4 py-2 text-gray-700 font-medium focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white shadow-sm">
                <option value="10">Top 10</option>
                <option value="25">Top 25</option>
                <option value="50">Top 50</option>
            </select>
        </div>

        <!-- Podium (top 3) -->
        <div id="podiumSection" class="grid grid-cols-3 gap-4 mb-10 hidden">
            <div id="pod2" class="podium-card bg-white rounded-2xl p-5 text-center shadow-lg mt-8">
                <div class="w-16 h-16 rounded-full rank-2 flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3 overflow-hidden"
                    style="position:relative;">
                    <img id="pod2Img" src="/static/avatars/avtar1.jpg" alt="2nd Place"
                        style="width:100%;height:100%;object-fit:cover;">
                    <span
                        style="position:absolute;bottom:-2px;right:-2px;background:#C0C0C0;color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;border:2px solid white;">2</span>
                </div>
                <p id="pod2Name" class="font-bold text-gray-800 truncate"></p>
                <p id="pod2Score" class="text-gray-500 text-sm"></p>
            </div>
            <div id="pod1" class="podium-card bg-white rounded-2xl p-6 text-center shadow-xl">
                <div class="text-3xl mb-1">👑</div>
                <div class="w-20 h-20 rounded-full rank-1 flex items-center justify-center text-white text-3xl font-bold mx-auto mb-3 overflow-hidden"
                    style="position:relative;">
                    <img id="pod1Img" src="/static/avatars/avtar1.jpg" alt="1st Place"
                        style="width:100%;height:100%;object-fit:cover;">
                    <span
                        style="position:absolute;bottom:-2px;right:-2px;background:#FFD700;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;border:2px solid white;">1</span>
                </div>
                <p id="pod1Name" class="font-bold text-xl text-gray-800 truncate"></p>
                <p id="pod1Score" class="text-gray-500 text-sm"></p>
            </div>
            <div id="pod3" class="podium-card bg-white rounded-2xl p-5 text-center shadow-lg mt-12">
                <div class="w-16 h-16 rounded-full rank-3 flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3 overflow-hidden"
                    style="position:relative;">
                    <img id="pod3Img" src="/static/avatars/avtar1.jpg" alt="3rd Place"
                        style="width:100%;height:100%;object-fit:cover;">
                    <span
                        style="position:absolute;bottom:-2px;right:-2px;background:#CD7F32;color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;border:2px solid white;">3</span>
                </div>
                <p id="pod3Name" class="font-bold text-gray-800 truncate"></p>
                <p id="pod3Score" class="text-gray-500 text-sm"></p>
            </div>
        </div>

        <!-- Full Leaderboard Table -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex items-center gap-2">
                <i data-feather="list" class="text-purple-600"></i>
                <h2 class="font-semibold text-gray-800">Full Rankings</h2>
            </div>
            <div id="leaderboardList" class="divide-y divide-gray-100">
                <div class="text-center text-gray-400 py-12">Loading leaderboard...</div>
            </div>
        </div>
    </main>

    <footer class="text-center text-gray-400 py-6 mt-8 text-sm">
        <p>© 2025 QuizVerse. Keep learning, keep growing! 🌱</p>
    </footer>

    <script src="/static/dark-mode.js"></script>
    <script>
        let maxScore = 1;

        async function loadCategories() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            const sel = document.getElementById('categoryFilter');
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id; opt.textContent = c.name;
                sel.appendChild(opt);
            });
        }

        async function loadLeaderboard() {
            const catId = document.getElementById('categoryFilter').value;
            const limit = document.getElementById('limitFilter').value;
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '<div class="text-center text-gray-400 py-12">Loading...</div>';
            document.getElementById('podiumSection').classList.add('hidden');

            let url = `/api/leaderboard?limit=${limit}`;
            if (catId) url += `&category_id=${catId}`;

            const res = await fetch(url);
            const data = await res.json();

            if (!data.length) {
                list.innerHTML = '<div class="text-center text-gray-400 py-12"><div class="text-5xl mb-3">🎯</div><p>No scores yet. Be the first to play!</p></div>';
                return;
            }

            maxScore = Math.max(...data.map(r => r.percentage));

            // Podium
            if (data.length >= 1) {
                document.getElementById('podiumSection').classList.remove('hidden');
                ['pod1', 'pod2', 'pod3'].forEach((id, i) => {
                    const r = data[i];
                    if (r) {
                        document.getElementById(id + 'Name').textContent = r.username;
                        document.getElementById(id + 'Score').textContent = `${r.percentage}% · ${r.score}/${r.total}`;
                        document.getElementById(id + 'Img').src = `/static/avatars/${r.profile_picture || 'avtar1.jpg'}`;
                    } else {
                        document.getElementById(id).classList.add('opacity-30');
                    }
                });
            }

            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;

            list.innerHTML = data.map((r, i) => `
                <div class="lb-row flex items-center gap-4 p-4">
                    <div class="w-10 text-center font-bold ${i === 0 ? 'text-yellow-500 text-xl' : i === 1 ? 'text-gray-400 text-xl' : i === 2 ? 'text-amber-700 text-xl' : 'text-gray-400'}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}</div>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-400 to-blue-500 flex items-center justify-center text-white font-bold flex-shrink-0 overflow-hidden">
                        <img src="/static/avatars/${r.profile_picture || 'avtar1.jpg'}" alt="${r.username}" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-gray-800 truncate">${r.username}</p>
                        <div class="h-2 bg-gray-100 rounded-full mt-1 overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-purple-500 to-blue-500 rounded-full bar-fill" style="width: ${(r.percentage / maxScore * 100).toFixed(1)}%"></div>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <p class="font-bold text-purple-700">${r.percentage}%</p>
                        <p class="text-xs text-gray-400">${r.score}/${r.total} correct</p>
                    </div>
                    ${r.time_taken ? `<div class="text-right flex-shrink-0 ml-2">
                        <p class="text-xs text-gray-400"><i data-feather="clock" class="inline-block w-3 h-3"></i> ${formatTime(r.time_taken)}</p>
                    </div>` : ''}
                </div>`).join('');
        }

        loadCategories().then(() => {
            loadLeaderboard();
            feather.replace();
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/session-check', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const data = await res.json();
                    if (data.logged_in) {
                        const dashboardUrl = data.is_admin ? '/admin' : '/user_dashboard';
                        document.querySelectorAll('a[href="/"], a[href="/user_dashboard"]').forEach(el => el.href = dashboardUrl);
                        document.querySelectorAll('a[href="/explore"], a[href="/about"]').forEach(el => {
                            if (el.parentElement && el.parentElement.tagName === 'LI') {
                                el.parentElement.style.display = 'none';
                            } else {
                                el.style.display = 'none';
                            }
                        });
                    }
                } catch (e) { console.error('Session check failed', e); }
            }
        });
    </script>
</body>


</html>
