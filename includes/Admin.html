<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizVerse • Admin Panel</title>
    <link rel="icon" type="image/png" href="static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Dark Mode Support -->
    <link rel="stylesheet" href="static/dark-mode.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-item:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    {% set active_page = 'dashboard' %}
    {% include 'includes/admin_sidebar.html' %}

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden md:ml-64">
        <!-- Topbar -->
        <header class="bg-white border-b border-gray-200 flex items-center justify-between p-4">
            <div class="flex items-center space-x-4">
                <i id="menuToggle" data-feather="menu" class="cursor-pointer text-gray-600 md:hidden"></i>
                <h2 class="text-lg font-semibold text-gray-800">Dashboard</h2>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Dark Mode Toggle -->
                <button id="darkModeToggle"
                    class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center transition"
                    title="Toggle Dark Mode">
                    <i id="sunIcon" data-feather="sun" class="w-5 h-5"></i>
                    <i id="moonIcon" data-feather="moon" class="w-5 h-5" style="display: none;"></i>
                </button>

                <div class="flex items-center space-x-2">
                    <div
                        class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-blue-500 text-white flex items-center justify-center">
                        <img src="{{ url_for('static', filename='avatars/admin_av.png') }}" alt="Admin Avatar"
                            class="w-full h-full rounded-full">
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                <!-- ... existing cards ... -->
                <div class="card bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500">Total Users</p>
                            <h3 class="text-2xl font-bold" id="statTotalUsers">{{ total_users }}</h3>
                        </div>
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                            <i data-feather="users"></i>
                        </div>
                    </div>
                </div>
                <!-- ... other cards ... -->
                <div class="card bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500">Total Questions</p>
                            <h3 class="text-2xl font-bold" id="statTotalQuizzes">...</h3>
                        </div>
                        <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                            <i data-feather="help-circle"></i>
                        </div>
                    </div>
                </div>
                <div class="card bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500">Total Categories</p>
                            <h3 class="text-2xl font-bold" id="statTotalCategories">...</h3>
                        </div>
                        <div class="p-3 rounded-full bg-green-100 text-green-600">
                            <i data-feather="layers"></i>
                        </div>
                    </div>
                </div>
                <div class="card bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500">Total Attempts</p>
                            <h3 class="text-2xl font-bold" id="statTotalAttempts">...</h3>
                        </div>
                        <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                            <i data-feather="activity"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quiz Trends Chart -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="font-semibold text-lg mb-4">Quiz Attempts Trend (Last 7 Days)</h3>
                <div class="h-64">
                    <canvas id="trendsChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Recent Activity -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="p-4 border-b border-gray-200">
                        <h3 class="font-semibold text-lg">Recent Activity</h3>
                    </div>
                    <div class="divide-y divide-gray-200" id="activityFeed"
                        style="max-height: 450px; overflow-y: auto;">
                        <div class="p-4 text-center text-gray-500">Loading activity...</div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="p-4 border-b border-gray-200">
                        <h3 class="font-semibold text-lg">Quick Actions</h3>
                    </div>
                    <div class="p-4 grid grid-cols-2 gap-4">
                        <button onclick="location.href='admin_users.html'"
                            class="flex flex-col items-center justify-center p-4 rounded-lg border border-gray-200 hover:bg-gray-50 transition group">
                            <div
                                class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-110 transition">
                                <i data-feather="users"></i>
                            </div>
                            <span class="text-sm font-medium">Manage Users</span>
                        </button>

                        <button onclick="location.href='admin_quiz.html'"
                            class="flex flex-col items-center justify-center p-4 rounded-lg border border-gray-200 hover:bg-gray-50 transition group">
                            <div
                                class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center mb-2 group-hover:scale-110 transition">
                                <i data-feather="help-circle"></i>
                            </div>
                            <span class="text-sm font-medium">Manage Quizzes</span>
                        </button>

                        <button onclick="location.href='admin_settings.html'"
                            class="flex flex-col items-center justify-center p-4 rounded-lg border border-gray-200 hover:bg-gray-50 transition group">
                            <div
                                class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center mb-2 group-hover:scale-110 transition">
                                <i data-feather="settings"></i>
                            </div>
                            <span class="text-sm font-medium">System Settings</span>
                        </button>

                        <button onclick="location.href='leaderboard.html'"
                            class="flex flex-col items-center justify-center p-4 rounded-lg border border-gray-200 hover:bg-gray-50 transition group">
                            <div
                                class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center mb-2 group-hover:scale-110 transition">
                                <i data-feather="trending-up"></i>
                            </div>
                            <span class="text-sm font-medium">Public Rankings</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        feather.replace();
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
        }

        // Load real stats from API
        const token = localStorage.getItem('access_token');
        if (token) {
            fetch('/api/admin/stats', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => res.json())
                .then(data => {
                    const totalUsers = document.getElementById('statTotalUsers');
                    const totalQuizzes = document.getElementById('statTotalQuizzes');
                    const totalCategories = document.getElementById('statTotalCategories');
                    const totalAttempts = document.getElementById('statTotalAttempts');

                    if (totalUsers) totalUsers.textContent = data.total_users ?? '—';
                    if (totalQuizzes) totalQuizzes.textContent = data.total_quizzes ?? '—';
                    if (totalCategories) totalCategories.textContent = data.total_categories ?? '—';
                    if (totalAttempts) totalAttempts.textContent = data.total_attempts ?? '—';

                    // Update Activity Feed
                    const activityFeed = document.getElementById('activityFeed');
                    if (activityFeed && data.activity) {
                        activityFeed.innerHTML = data.activity.map(act => `
                            <div class="p-4 flex items-start space-x-4">
                                <div class="flex-shrink-0">
                                    <div class="w-10 h-10 rounded-full bg-${act.color}-100 text-${act.color}-600 flex items-center justify-center">
                                        <i data-feather="${act.icon}"></i>
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-gray-900">${act.message}</p>
                                    <p class="text-xs text-gray-400 mt-1">${formatTime(act.time)}</p>
                                </div>
                            </div>
                        `).join('');
                        feather.replace();
                    }

                    // Render Chart
                    if (data.chart_data) {
                        renderChart(data.chart_data);
                    }
                })
                .catch(err => console.warn('Stats API error:', err));
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 0) return 'Just now'; // Handle slight client/server desync
            if (diffInSeconds < 60) return 'Just now';
            if (diffInSeconds < 3600) return Math.floor(diffInSeconds / 60) + 'm ago';
            if (diffInSeconds < 86400) {
                const hours = Math.floor(diffInSeconds / 3600);
                if (hours === 1) return '1h ago';

                // If it's the same day, show hours ago, else show "Today at..."
                if (date.getDate() === now.getDate()) {
                    return hours + 'h ago';
                }
            }

            // Check for Yesterday
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (date.getDate() === yesterday.getDate() && date.getMonth() === yesterday.getMonth() && date.getFullYear() === yesterday.getFullYear()) {
                return 'Yesterday at ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderChart(chartData) {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [{
                        label: 'Quiz Attempts',
                        data: chartData.map(d => d.count),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }

    </script>

    <!-- Dark Mode Script -->
    <script src="static/dark-mode.js"></script>
</body>

</html>
